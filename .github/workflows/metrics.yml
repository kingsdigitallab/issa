name: Metrics

on:
  schedule:
    # GitHub's Traffic API only retains 14 days of history, so this must
    # run well within that window. Daily leaves a wide safety margin.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect traffic snapshot
        env:
          METRICS_PAT: ${{ secrets.METRICS_PAT }}
          GOATCOUNTER_API: ${{ secrets.GOATCOUNTER_API }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/collect_metrics.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/traffic.json
          if git diff --cached --quiet; then
            echo "No traffic changes to commit."
          else
            git commit -m "chore(metrics): snapshot GitHub traffic data [skip ci]"
            git push
          fi
