[project]
name = "issa-paratext-poc"
version = "0.1.0"
requires-python = ">=3.11"
# Pinned to the video-review branch (unreleased — the media/tracks/video-player
# features this PoC depends on aren't in the paratext-cli 0.7.0 PyPI release yet).
# Bump to a plain "paratext-cli" version pin once video-review ships.
dependencies = ["paratext-cli @ git+https://github.com/nls-lst/paratext.git@video-review"]

[project.entry-points."paratext.projects"]
issa-segments = "issa_segments:PROJECT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["issa_segments"]

[dependency-groups]
dev = ["pytest>=8.0"]
